name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_debug_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 / 36.1 & Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
          sdkmanager --channel=3 "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ ! -d "${SDK_DIR}/platforms/android-36.1" ]; then
            if [ -d "${SDK_DIR}/platforms/android-36" ]; then
              sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
            else
              sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
              sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
              sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env configuration
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${SECRET_GEMINI_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${SECRET_GEMINI_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Copy Debug APK with friendly filename
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
