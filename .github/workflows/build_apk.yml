name: Build Signed Android APK (katib v2.0.3)

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env configuration
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${SECRET_GEMINI_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${SECRET_GEMINI_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          rm -f debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore || true
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare release signing keystore and credentials
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/keystore"
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/build/keystore/my-upload-key.jks"
          rm -f "$KEYSTORE_FILE" "${GITHUB_WORKSPACE}/my-upload-key.jks"

          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SECRET_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE" || true
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" ]; then
            tr -d '[:space:]' < "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" | base64 --decode > "$KEYSTORE_FILE" || true
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          else
            STORE_PASS="katib2026"
            KEY_PASS="katib2026"
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE_FILE"
            STORE_PASS="katib2026"
            KEY_PASS="katib2026"
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Katib App, OU=Mobile, O=Katib, L=Riyadh, ST=Riyadh, C=SA"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: Build Signed Release APK & Debug APK
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Copy APKs with friendly filenames
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-release-signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-v2.0.3-signed-apk
          path: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/release/katib-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct Download)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: "تطبيق katib - الإصدار 2.0.3 (ملف APK جاهز للتحميل والتثبيت)"
          body: |
            ### تحميل تطبيق katib (الإصدار 2.0.3) للأندرويد 📱
            - **نسخة الإصدار النهائي الموقعة (موصى بها للتثبيت على الهاتف):** `katib-v2.0.3-release-signed.apk`
            - **النسخة التجريبية:** `katib-v2.0.3-debug.apk`
          prerelease: false
          files: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/release/katib-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
