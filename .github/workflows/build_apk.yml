name: Build Signed Android APK (katib v2.0.3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Gradle & Android SDK for GitHub Runner
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          # Check if AGP 9.1.1 and Gradle 9.3.1 are publicly reachable on this runner
          if curl -fsSL -I "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.1.1/gradle-9.1.1.pom" >/dev/null 2>&1 && \
             curl -fsSL -I "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >/dev/null 2>&1; then
            echo "Using AGP 9.1.1 + Gradle 9.3.1"
            echo "GRADLE_DIST_VERSION=9.3.1" >> "$GITHUB_ENV"
            sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || \
            sdkmanager --channel=3 "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            if [ -n "$SDK_DIR" ] && [ ! -d "${SDK_DIR}/platforms/android-36.1" ]; then
              if [ -d "${SDK_DIR}/platforms/android-36" ]; then
                sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
              else
                sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
                sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
                sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
              fi
            fi
          else
            echo "Container-only AGP/Gradle detected; normalizing to public Maven Central & Google Maven stable versions (Gradle 8.11.1 + AGP 8.7.3 + Kotlin 2.0.21)"
            echo "GRADLE_DIST_VERSION=8.11.1" >> "$GITHUB_ENV"
            sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" || true

            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

            cat > gradle/libs.versions.toml << 'EOF'
          [versions]
          agp = "8.7.3"
          coreKtx = "1.15.0"
          junit = "4.13.2"
          junitVersion = "1.2.1"
          espressoCore = "3.6.1"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.9.3"
          kotlin = "2.0.21"
          composeBom = "2024.09.00"
          googleDevtoolsKsp = "2.0.21-1.0.28"
          navigationCompose = "2.8.5"
          roomRuntime = "2.6.1"
          roomKtx = "2.6.1"
          roomCompiler = "2.6.1"
          kotlinxCoroutinesTest = "1.9.0"
          core = "1.6.1"
          runner = "1.6.2"
          coilCompose = "2.7.0"
          retrofit = "2.11.0"
          converterMoshi = "2.11.0"
          kotlinxCoroutinesAndroid = "1.9.0"
          kotlinxCoroutinesCore = "1.9.0"
          accompanistPermissions = "0.36.0"
          playServicesLocation = "21.3.0"
          cameraCamera2 = "1.4.1"
          cameraLifecycle = "1.4.1"
          cameraView = "1.4.1"
          cameraCore = "1.4.1"
          loggingInterceptor = "4.12.0"
          okhttp = "4.12.0"
          moshiKotlin = "1.15.2"
          moshiKotlinCodegen = "1.15.2"
          datastorePreferences = "1.1.1"
          workRuntime = "2.10.0"
          robolectric = "4.14.1"
          secretsGradlePlugin = "2.0.1"
          credentials = "1.3.0"
          googleid = "1.1.1"
          playBilling = "7.1.1"

          [libraries]
          play-billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "playBilling" }
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
          androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }
          play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
          androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraCamera2" }
          androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraLifecycle" }
          androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraView" }
          androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraCore" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
          androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
          androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
          googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
          EOF

            cat > build.gradle.kts << 'EOF'
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
          }
          EOF

            cat > app/build.gradle.kts << 'EOF'
          import java.util.Base64

          plugins {
            alias(libs.plugins.android.application)
            alias(libs.plugins.kotlin.android)
            alias(libs.plugins.kotlin.compose)
            alias(libs.plugins.google.devtools.ksp)
            alias(libs.plugins.secrets)
          }

          android {
            namespace = "com.example"
            compileSdk = 35

            defaultConfig {
              applicationId = "com.aistudio.khetta.afgbho"
              minSdk = 24
              targetSdk = 35
              versionCode = 203
              versionName = "2.0.3"

              testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            signingConfigs {
              create("release") {
                val keystoreFile = file(System.getenv("KEYSTORE_PATH")?.takeIf { it.isNotBlank() } ?: "${rootDir}/my-upload-key.jks")
                if (!keystoreFile.exists()) {
                  val base64File = file("${rootDir}/my-upload-key.jks.base64")
                  if (base64File.exists()) {
                    val cleaned = base64File.readText().replace("\\s".toRegex(), "")
                    keystoreFile.writeBytes(Base64.getDecoder().decode(cleaned))
                  }
                }
                storeFile = keystoreFile
                storePassword = System.getenv("STORE_PASSWORD")?.takeIf { it.isNotBlank() } ?: "katib2026"
                keyAlias = "upload"
                keyPassword = System.getenv("KEY_PASSWORD")?.takeIf { it.isNotBlank() } ?: "katib2026"
              }
              create("debugConfig") {
                val debugKeystoreFile = file("${rootDir}/debug.keystore")
                if (!debugKeystoreFile.exists()) {
                  val debugBase64File = file("${rootDir}/debug.keystore.base64")
                  if (debugBase64File.exists()) {
                    val cleaned = debugBase64File.readText().replace("\\s".toRegex(), "")
                    debugKeystoreFile.writeBytes(Base64.getDecoder().decode(cleaned))
                  }
                }
                storeFile = debugKeystoreFile
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }

            buildTypes {
              release {
                isCrunchPngs = false
                isMinifyEnabled = false
                proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                signingConfig = signingConfigs.getByName("release")
              }
              debug { signingConfig = signingConfigs.getByName("debugConfig") }
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_11
              targetCompatibility = JavaVersion.VERSION_11
            }
            kotlinOptions {
              jvmTarget = "11"
            }
            buildFeatures {
              compose = true
              buildConfig = true
            }
            testOptions { unitTests { isIncludeAndroidResources = true } }
            dependenciesInfo {
              includeInApk = false
              includeInBundle = true
            }
          }

          secrets {
            val envFile = file("${rootDir}/.env")
            val envExampleFile = file("${rootDir}/.env.example")
            if (!envFile.exists() && envExampleFile.exists()) {
              envExampleFile.copyTo(envFile, overwrite = false)
            }
            propertiesFileName = ".env"
            defaultPropertiesFileName = ".env.example"
            ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
          }

          dependencies {
            implementation(platform(libs.androidx.compose.bom))
            implementation(libs.androidx.activity.compose)
            implementation(libs.androidx.compose.material.icons.core)
            implementation(libs.androidx.compose.material.icons.extended)
            implementation(libs.androidx.compose.material3)
            implementation(libs.androidx.compose.ui)
            implementation(libs.androidx.compose.ui.graphics)
            implementation(libs.androidx.compose.ui.tooling.preview)
            implementation(libs.androidx.core.ktx)
            implementation(libs.androidx.datastore.preferences)
            implementation(libs.androidx.lifecycle.runtime.compose)
            implementation(libs.androidx.lifecycle.runtime.ktx)
            implementation(libs.androidx.lifecycle.viewmodel.compose)
            implementation(libs.androidx.navigation.compose)
            implementation(libs.androidx.room.ktx)
            implementation(libs.androidx.room.runtime)
            implementation(libs.androidx.work.runtime.ktx)
            implementation(libs.play.billing.ktx)
            implementation(libs.coil.compose)
            implementation(libs.converter.moshi)
            implementation(libs.kotlinx.coroutines.android)
            implementation(libs.kotlinx.coroutines.core)
            implementation(libs.logging.interceptor)
            implementation(libs.moshi.kotlin)
            implementation(libs.okhttp)
            implementation(libs.retrofit)
            testImplementation(libs.androidx.compose.ui.test.junit4)
            testImplementation(libs.androidx.core)
            testImplementation(libs.androidx.junit)
            testImplementation(libs.junit)
            testImplementation(libs.kotlinx.coroutines.test)
            testImplementation(libs.robolectric)
            androidTestImplementation(platform(libs.androidx.compose.bom))
            androidTestImplementation(libs.androidx.compose.ui.test.junit4)
            androidTestImplementation(libs.androidx.espresso.core)
            androidTestImplementation(libs.androidx.junit)
            androidTestImplementation(libs.androidx.runner)
            debugImplementation(libs.androidx.compose.ui.test.manifest)
            debugImplementation(libs.androidx.compose.ui.tooling)
            "ksp"(libs.androidx.room.compiler)
            "ksp"(libs.moshi.kotlin.codegen)
          }
          EOF
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_DIST_VERSION }}

      - name: Prepare .env configuration
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${SECRET_GEMINI_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${SECRET_GEMINI_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare release signing keystore and credentials
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SECRET_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          elif [ -f "$KEYSTORE_FILE" ]; then
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" ]; then
            tr -d '[:space:]' < "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass katib2026 -keypass katib2026 \
              -dname "CN=Katib App, OU=Mobile, O=Katib, L=Riyadh, ST=Riyadh, C=SA"
            STORE_PASS="katib2026"
            KEY_PASS="katib2026"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: Build Signed Release APK & Debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" -Dkotlin.compiler.execution.strategy=daemon
        run: |
          gradle assembleRelease assembleDebug -x lintVitalRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Copy APKs with friendly filenames
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-release-signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-v2.0.3-signed-apk
          path: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/release/katib-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (Direct Download)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: "تطبيق katib - الإصدار 2.0.3 (ملف APK جاهز للتحميل والتثبيت)"
          body: |
            ### تحميل تطبيق katib (الإصدار 2.0.3) للأندرويد 📱
            - **نسخة الإصدار النهائي الموقعة (موصى بها للتثبيت على الهاتف):** `katib-v2.0.3-release-signed.apk`
            - **النسخة التجريبية:** `katib-v2.0.3-debug.apk`
          prerelease: false
          files: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/release/katib-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
