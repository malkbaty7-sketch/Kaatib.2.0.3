name: Build Signed Android APK (katib v2.0.3)

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_signed_apk:
    # Do not expose signing secrets to pull-request code, especially fork PRs.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env configuration
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${SECRET_GEMINI_KEY:-}" ]; then
            printf 'GEMINI_API_KEY=%s\\n' "$SECRET_GEMINI_KEY" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            printf 'GEMINI_API_KEY=MY_GEMINI_API_KEY\\n' > .env
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \\
            -keyalg RSA -keysize 2048 -validity 10000 \\
            -storepass android -keypass android \\
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare and validate private release signing credentials
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SECRET_KEYSTORE_BASE64:?Missing GitHub Secret KEYSTORE_BASE64}"
          : "${SECRET_STORE_PASSWORD:?Missing GitHub Secret STORE_PASSWORD}"
          : "${SECRET_KEY_PASSWORD:?Missing GitHub Secret KEY_PASSWORD}"

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/build/keystore/my-upload-key.jks"
          mkdir -p "$(dirname "$KEYSTORE_FILE")"
          printf '%s' "$SECRET_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASSWORD" -alias upload >/dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            echo "KEY_ALIAS=upload"
          } >> "$GITHUB_ENV"

      - name: Build Signed Release APK & Debug APK
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Copy APKs with friendly filenames
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/katib-v2.0.3-debug.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-v2.0.3-signed-apk
          path: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases (version tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "تطبيق Katib - ${{ github.ref_name }}"
          body: |
            ### ملفات تثبيت Katib للأندرويد
            - النسخة النهائية الموقعة: katib-v2.0.3-release-signed.apk
            - النسخة التجريبية: katib-v2.0.3-debug.apk
          prerelease: false
          files: |
            app/build/outputs/apk/release/katib-v2.0.3-release-signed.apk
            app/build/outputs/apk/debug/katib-v2.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
