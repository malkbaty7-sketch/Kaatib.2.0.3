name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_signed_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env configuration
        shell: bash
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${SECRET_GEMINI_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${SECRET_GEMINI_KEY}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Prepare debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare release signing keystore and credentials
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          elif [ -f "$KEYSTORE_FILE" ]; then
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" ]; then
            base64 --decode "${GITHUB_WORKSPACE}/my-upload-key.jks.base64" > "$KEYSTORE_FILE"
            STORE_PASS="${SECRET_STORE_PASSWORD:-katib2026}"
            KEY_PASS="${SECRET_KEY_PASSWORD:-katib2026}"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass katib2026 -keypass katib2026 \
              -dname "CN=Katib App, OU=Mobile, O=Katib, L=Riyadh, ST=Riyadh, C=SA"
            STORE_PASS="katib2026"
            KEY_PASS="katib2026"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK with friendly filename
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/katib-release-signed.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: katib-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
